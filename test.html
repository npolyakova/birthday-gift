<html>
<body>
  <canvas id="c"></canvas>

<script>

  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');

  let W, H;
  function resize() {
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
  } 
  resize();
  window.addEventListener('resize', resize);
  

  function sway(t, amp = 0.02, speed = 1.5) {
  return Math.sin(t * speed) * amp;
}

  // ---------- ???? ???????? ???????? (?????) ----------
// ?????? ???? ??? ????? ????. ????????? ?????? ? ????? — ??????.
function drawSittingPerson(opts) {
  // opts: {x, y, s, skin, hair, hairLen, top, topShade, pants,
  //        pose (0..1 — ??????), warmSide, hairStyle}
  const { x, y, s, skin, hair, hairLen, top, topShade, pants, pose = 0, warmSide = -1, hairStyle = 'short' } = opts;

  const t = performance.now() / 1000;
  const breathe = sway(t, 1, 5);          // ???????
  const tilt = sway(t, 0.01, 0.7) + pose;       // ?????? ???????????

  ctx.save();
  ctx.translate(x, y);
  ctx.scale(s, s);

  // ?????? ???? ??????
  ctx.rotate(tilt * 0.05);

  // --- ???? ---
  ctx.fillStyle = pants;
  ctx.beginPath();
  ctx.fillRect(-31, -25, 62, 15);

  // --- ???? (?????) ---
  const torsoGrad = ctx.createLinearGradient(0, -90, 0, -20);
  torsoGrad.addColorStop(0, top);
  torsoGrad.addColorStop(1, topShade);
  ctx.fillStyle = torsoGrad;
  ctx.beginPath();
  ctx.moveTo(-30 + breathe * 2, -22);
  ctx.quadraticCurveTo(-38, -60, -28, -88);
  ctx.quadraticCurveTo(0, -98, 28, -88);
  ctx.quadraticCurveTo(38, -60, 30 + breathe * 2, -22);
  ctx.quadraticCurveTo(0, -14, -30 + breathe * 2, -22);
  ctx.closePath();
  ctx.fill();

  // ??????? ?? ????? (?????)
  ctx.strokeStyle = 'rgba(0,0,0,0.18)';
  ctx.lineWidth = 1.2;
  ctx.beginPath();
  ctx.moveTo(0, -84);
  ctx.quadraticCurveTo(-4 + breathe * 2, -55, 0, -24);
  ctx.stroke();

  // --- ??? ---
  ctx.fillStyle = skin;
  ctx.beginPath();
  ctx.roundRect(-9, -104, 18, 15, 5);
  ctx.fill();

  // --- ?????? (???????) ---
  ctx.fillStyle = skin;
  ctx.beginPath();
  ctx.ellipse(0, -118, 22, 25, 0, 0, Math.PI * 2);
  ctx.fill();

  // --- ?????? ---
  ctx.fillStyle = hair;
  if (hairStyle === 'short') {
    ctx.beginPath();
    ctx.ellipse(0, -122, 24, 24, 0, Math.PI * 0.95, Math.PI * 2.05);
    ctx.quadraticCurveTo(22, -112, 20, -100);
    ctx.quadraticCurveTo(0, -108, -20, -100);
    ctx.quadraticCurveTo(-22, -112, -24, -122);
    ctx.fill();
  } else if (hairStyle === 'long') {
    // ??????? ?????? — ?????? ?? ?????
    ctx.beginPath();
    ctx.ellipse(0, -122, 25, 26, 0, Math.PI * 0.9, Math.PI * 2.1);
    ctx.lineTo(26, -60);
    ctx.quadraticCurveTo(30, -55, 22, -55);
    ctx.quadraticCurveTo(18, -80, 14, -100);
    ctx.quadraticCurveTo(0, -110, -14, -100);
    ctx.quadraticCurveTo(-18, -80, -22, -55);
    ctx.quadraticCurveTo(-30, -55, -26, -60);
    ctx.closePath();
    ctx.fill();

    // ????? ??? ??????
    ctx.strokeStyle = 'rgba(0,0,0,0.2)';
    ctx.lineWidth = 1;
    for (let i = -1; i <= 1; i++) {
      ctx.beginPath();
      ctx.moveTo(i * 8, -130);
      ctx.quadraticCurveTo(i * 14, -95, i * 10, -110);
      ctx.stroke();
    }
  }
  // 'shortGuy' — ???????? ?????? (??? ??????)
  else if (hairStyle === 'shortGuy') {
    ctx.beginPath();
    ctx.ellipse(0, -124, 23, 22, 0, Math.PI * 1.0, Math.PI * 3.0);
    ctx.quadraticCurveTo(0, -108, -23, -124);
    ctx.fill();
  }

  // --- ???? (??????? ????? ???? / ?????????) ---
  ctx.fillStyle = topShade;
  // ????? ????
  ctx.beginPath();
  ctx.moveTo(-28, -88);
  ctx.quadraticCurveTo(-42, -55, -38, -28);
  ctx.quadraticCurveTo(-20, -30, -24, -45);
  ctx.quadraticCurveTo(-26, -60, -22, -72);
  ctx.closePath();
  ctx.fill();
  // ?????? ????
  ctx.beginPath();
  ctx.moveTo(28, -88);
  ctx.quadraticCurveTo(42, -55, 38, -28);
  ctx.quadraticCurveTo(20, -30, 24, -45);
  ctx.quadraticCurveTo(26, -60, 22, -72);
  ctx.closePath();
  ctx.fill();

  // --- ?????? ????????? ?? ?????? ---

  ctx.restore();
}
function drawGuySummer(x, y, s) {
  drawSittingPerson({
    x, y, s,
    skin: '#d9a074',
    hair: '#3a2418',
    hairStyle: 'short',
    top: '#5b8fa8',        // ?????? ?????? ????????
    topShade: '#3e6d82',
    pants: '#3a4a5a',      // ?????/?????? ?????
    pose: 0.15,            // ?????? ??????????
    warmSide: -1,
  });
}
drawGuySummer(300, 300, 2)

  ctx.restore();
  </script>
  </body>
</html>
